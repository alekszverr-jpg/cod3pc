jump_address_on_false = 0x824A6484

[[midasm_hook]]
address = 0x824A5400
name = "Cod3SuspendScript"
return = true

[[midasm_hook]]
address = 0x824A5784
name = "Cod3SuspendScript"
return = true

# Timed wait: builds a delay object from f1 and queues it on the script thread.
[[midasm_hook]]
address = 0x824A56B4
name = "Cod3SuspendScript"
return = true

# Event wait: original dispatcher registers the event before suspending.
[[midasm_hook]]
address = 0x824AB824
name = "Cod3SuspendScript"
return = true
